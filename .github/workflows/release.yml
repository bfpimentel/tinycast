name: Release

run-name: "Tinycast ${{ inputs.version }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.11.13"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: tinycast-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable version such as 0.11.13."
            exit 1
          fi
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents: read/write on bfpimentel/homebrew-tap."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/bfpimentel/homebrew-tap.git" tap
          if [ ! -f tap/Casks/tinycast.rb ]; then
            echo "::error::Commit Casks/tinycast.rb to bfpimentel/homebrew-tap first."
            exit 1
          fi

      - name: Select Xcode 26
        run: |
          shopt -s nullglob
          XCODES=(/Applications/Xcode_26*.app)
          if [ "${#XCODES[@]}" -eq 0 ]; then
            echo "::error::No Xcode 26.x found on this runner."
            exit 1
          fi
          XCODE_PATH="$(printf '%s\n' "${XCODES[@]}" | sort -V | tail -n1)"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build and package arm64 DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-${{ inputs.version }}
          path: build/Tinycast-${{ inputs.version }}.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Install or update via Homebrew:

          \`\`\`sh
          brew trust --tap bfpimentel/tap
          brew install --cask bfpimentel/tap/tinycast
          brew upgrade --cask bfpimentel/tap/tinycast
          \`\`\`

          Requires macOS 26 (Tahoe) or later and Apple silicon."
          gh release create "v${VERSION}" "build/Tinycast-${VERSION}.dmg" \
            --target "$GITHUB_SHA" --title "Tinycast ${VERSION}" \
            --generate-notes --notes "$NOTES"

      - name: Update Homebrew cask
        run: |
          SHA="$(shasum -a 256 "build/Tinycast-${VERSION}.dmg" | awk '{print $1}')"
          CASK_FILE="tap/Casks/tinycast.rb"
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tinycast.rb
          if ! git diff --cached --quiet; then
            git commit -m "tinycast ${VERSION}"
            git push
          fi
